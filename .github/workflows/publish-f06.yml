name: Publish F06
on:
  push:
    branches: [handbook/f06-use-case]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/publish_f06_v2.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-learning/data
          git commit -m "docs(android-learning): publish F06 Use Case" || exit 0
          git push
