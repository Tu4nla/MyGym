name: Publish E10
on:
  push:
    branches: [handbook/e10-memory-anr-performance]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/publish_e10.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-learning/data
          git commit -m "docs(android-learning): publish E10 Memory ANR and Performance" || exit 0
          git push
