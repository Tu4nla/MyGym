name: Publish F08
on:
  push:
    branches: [handbook/f08-single-source-of-truth]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: handbook/f08-single-source-of-truth
      - run: python scripts/publish_f08.py || true
      - run: python scripts/fix_f08.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-learning/data
          git commit -m "docs(android-learning): publish F08 Single Source of Truth" || exit 0
          git push origin HEAD:handbook/f08-single-source-of-truth
