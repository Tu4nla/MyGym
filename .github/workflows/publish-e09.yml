name: Publish E09
on:
  push:
    branches: [handbook/e09-app-link-deep-link]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/publish_e09.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-learning/data
          git commit -m "docs(android-learning): publish E09 App Link and Deep Link" || exit 0
          git push
