name: Publish E06
on:
  push:
    branches: [handbook/e06-workmanager]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: handbook/e06-workmanager
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/publish_e06.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-learning/data/lessons/e/e06.json android-learning/data/catalog.json android-learning/data/search-index.json android-learning/data/book-plan.json validation-e06.json
          git diff --cached --quiet || git commit -m "docs(android-learning): publish E06 content and metadata"
          git push origin HEAD:handbook/e06-workmanager