<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a08">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Assistant">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <title>MyGym Personal Assistant v13.1</title>
  <link rel="manifest" href="pt-manifest.json?v=131">
  <link rel="stylesheet" href="pt-v13.css?v=13">
  <link rel="stylesheet" href="pt-v13-actions.css?v=131">
</head>
<body>
  <div class="v13-shell">
    <header class="v13-header">
      <a class="back" href="./">← MyGym</a>
      <div class="eyebrow" style="margin-top:10px">PERSONAL ASSISTANT • V13.1</div>
      <h1>My Assistant</h1>
    </header>

    <nav class="v13-tabs" aria-label="My Assistant navigation">
      <button class="active" data-tab="assistant" type="button">Trợ lý</button>
      <button data-tab="workout" type="button">Workout</button>
      <button data-tab="plan" type="button">Kế hoạch</button>
      <button data-tab="journal" type="button">Nhật ký</button>
      <button data-tab="progress" type="button">Tiến độ</button>
      <button data-tab="coach" type="button">PT</button>
    </nav>

    <main>
      <section class="v13-panel" data-panel="assistant">
        <div id="v13-assistant">
          <div class="static-fallback"><div class="eyebrow">ĐANG KHỞI ĐỘNG</div><h2>Trợ lý đang đọc trạng thái hôm nay…</h2><p class="muted">Nếu JavaScript tải chậm, nội dung này vẫn luôn hiện thay vì màn hình đen.</p></div>
        </div>
      </section>
      <section class="v13-panel" data-panel="workout" hidden><div id="v13-workout"><div class="static-fallback"><h2>Workout</h2><p class="muted">Đang tải giáo án…</p></div></div></section>
      <section class="v13-panel" data-panel="plan" hidden><div id="v13-plan"><div class="static-fallback"><h2>Kế hoạch</h2><p class="muted">Đang tải lịch và thực đơn…</p></div></div></section>
      <section class="v13-panel" data-panel="journal" hidden><div id="v13-journal"><div class="static-fallback"><h2>Nhật ký</h2></div></div></section>
      <section class="v13-panel" data-panel="progress" hidden><div id="v13-progress"><div class="static-fallback"><h2>Tiến độ</h2></div></div></section>
      <section class="v13-panel" data-panel="coach" hidden><div id="v13-coach"><div class="static-fallback"><h2>PT</h2></div></div></section>
    </main>
  </div>
  <div id="v13-toast" class="v13-toast"></div>

  <script src="pt-source.js?v=13"></script>
  <script src="pt-data.js?v=13"></script>
  <script src="pt-food-vn.js?v=13"></script>
  <script src="pt-cloud-config.js?v=13"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="pt-v13.js?v=13"></script>
  <script src="pt-v13-actions.js?v=131"></script>
</body>
</html>
